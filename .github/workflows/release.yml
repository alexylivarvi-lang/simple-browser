name: Build and Release SimpleBrowser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Generate Application Icons
        run: |
          python generate_icon.py

      - name: Build Standalone Windows Executable
        run: |
          python build_exe.py

      - name: Build Windows Installer (Setup.exe)
        run: |
          iscc installer.iss

      - name: Create ZIP Archive
        run: |
          Compress-Archive -Path dist\SimpleBrowser.exe -DestinationPath dist\SimpleBrowser-Windows.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/SimpleBrowser-Setup.exe
            dist/SimpleBrowser.exe
            dist/SimpleBrowser-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
